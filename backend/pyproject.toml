[project]
name = "memoryos-backend"
version = "0.1.0"
description = "MemoryOS local backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "lancedb>=0.8.2",
    "openai>=1.30.1",
    "pillow>=10.3.0",
    "aiofiles>=23.2.1",
    "beautifulsoup4>=4.12.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
