[project]
name = "memoryos"
version = "0.1.0"
description = "A local-first personal memory app with AI-powered search and retrieval"
authors = [
  { name = "samet", email = "staspinar@smileshape.ai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Python dependencies live in backend/pyproject.toml
# Run: cd backend && uv sync

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
addopts = ["-ra", "-q"]
asyncio_mode = "auto"
pythonpath = ["."]
python_files = ["*__ut.py", "*__it.py"]
markers = ["integration", "unit"]


[tool.ruff]
target-version = "py312"
unsafe-fixes = false
force-exclude = false


[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  #  "N",
  #  "D", # pydocstyle - docstring code style https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "UP",
  "YTT",
  "ANN",
  "ARG001",
  "ASYNC",
  #  "S",
  "A",
  "C4",
  "DTZ",
  "T10",
  #  "T20",
  #  "ERA",
  #  "EXE",
  "ISC",
  "ICN001",
  "LOG",
  "G",
  "PIE",
  "PYI",
  "PT",
  "RSE",
  #  "SLF",
